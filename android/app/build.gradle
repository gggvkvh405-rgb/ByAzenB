plugins {
    id 'com.android.application'
}

android {
    namespace 'com.byazenb.bladeandcoins'
    compileSdk 34

    defaultConfig {
        applicationId 'com.byazenb.bladeandcoins'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // игра самодостаточна: внешние библиотеки не нужны (только framework WebView)
}
