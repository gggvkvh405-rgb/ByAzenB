name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "sdk=$SDK"
          ls "$SDK" || true
          MGR=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager" "$(command -v sdkmanager || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then MGR="$c"; break; fi
          done
          echo "sdkmanager=$MGR"
          if [ -n "$MGR" ]; then
            yes 2>/dev/null | "$MGR" --licenses > /dev/null 2>&1 || true
            "$MGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Install Gradle 8.2
        run: |
          set -e
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -q -o -d /opt /tmp/gradle.zip
          sudo chmod +x /opt/gradle-8.2/bin/gradle
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Copy web game into Android assets
        run: |
          set -e
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r game/. android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/assets/src_*.png
          du -sh android/app/src/main/assets/www

      - name: Build APK
        id: gradle_build
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Klinok-i-Monety-Kuznitsa-Khaosa.apk
          ls -la *.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blade-and-coins-apk
          path: Klinok-i-Monety-Kuznitsa-Khaosa.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          APK="Klinok-i-Monety-Kuznitsa-Khaosa.apk"
          gh release view apk --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1 || \
            gh release create apk --repo "${GITHUB_REPOSITORY}" \
              --title "Клинок и Монеты: Кузница Хаоса — APK" \
              --notes "Автосборка ветки ${GITHUB_REF_NAME} (run ${GITHUB_RUN_NUMBER}).\n\nУстановка: скачать APK, разрешить установку из неизвестных источников. Android 7.0+, интернет не нужен."
          gh release upload apk "${APK}" --repo "${GITHUB_REPOSITORY}" --clobber
          echo "release uploaded"

      - name: Commit APK into dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p dist
          rm -f dist/blade-and-coins.apk dist/blade-and-coins.apk.sha1
          cp Klinok-i-Monety-Kuznitsa-Khaosa.apk dist/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "APK не изменился"; exit 0
          fi
          git commit -m "APK: сборка run ${GITHUB_RUN_NUMBER}"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}" > dist-push.log 2>&1
          code=$?
          echo "push exit: $code"
          cat dist-push.log
          if [ "$code" != "0" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "APK push failed (run ${GITHUB_RUN_NUMBER})" --body "$(tail -c 3000 dist-push.log)" || true
          fi
          exit 0
