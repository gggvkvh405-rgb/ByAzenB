name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.2
        run: |
          set -e
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -q -o -d /opt /tmp/gradle.zip
          sudo chmod +x /opt/gradle-8.2/bin/gradle
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Copy web game into Android assets
        run: |
          set -e
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r game/. android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/assets/src_*.png
          du -sh android/app/src/main/assets/www

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Klinok-i-Monety-Kuznitsa-Khaosa.apk"
          ls -la *.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blade-and-coins-apk
          path: Klinok-i-Monety-Kuznitsa-Khaosa.apk
          if-no-files-found: error
