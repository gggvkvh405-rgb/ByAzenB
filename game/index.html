<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Клинок и Монеты: Кузница Хаоса</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo.png">
</head>
<body>
<div id="app">

  <canvas id="scene"></canvas>
  <div id="weather"></div>

  <!-- ============ HUD ============ -->
  <header id="hud">
    <div class="hud-row">
      <div class="hud-chip" id="hud-wave">🌊 <b>1</b></div>
      <div class="hud-chip" id="hud-biome">🌿 Поля</div>
      <div class="hud-chip" id="hud-weather">☀️ Ясно</div>
    </div>
    <div class="hud-row hud-cur">
      <div class="cur gold" id="cur-gold">🪙 <b>0</b></div>
      <div class="cur" id="cur-crystals">💎 <b>0</b></div>
      <div class="cur" id="cur-souls">👻 <b>0</b></div>
    </div>
    <div class="hpbars">
      <div class="hpwrap hero">
        <div class="hpbar"><div class="hpfill" id="hero-hpfill"></div><span id="hero-hptext">100/100</span></div>
      </div>
      <div class="ragewrap">
        <div class="ragebar"><div class="ragefill" id="rage-fill"></div><span id="rage-text">ЯРОСТЬ</span></div>
      </div>
    </div>
  </header>

  <!-- ============ BATTLE SCREEN ============ -->
  <section class="screen active" id="scr-battle">
    <div id="bossbar" class="hidden">
      <div class="boss-name" id="boss-name">БОСС</div>
      <div class="boss-hp"><div class="boss-fill" id="boss-fill"></div><span id="boss-hptext"></span></div>
    </div>
    <div id="wave-banner" class="hidden"></div>
    <div id="gates-strip"></div>
    <button id="ult-btn" class="ult hidden">⚡ УЛЬТА</button>
    <div id="combo-badge" class="hidden"></div>
    <div id="tap-hint">👆 ЖМИ!</div>
    <div class="battle-side">
      <button class="side-btn" id="btn-autobattle" title="Автобой">🤖</button>
      <button class="side-btn" id="btn-hero-swap" title="Смена героя">🔄</button>
      <button class="side-btn" id="btn-x2" title="x2 золото">🎬</button>
    </div>
    <div id="offline-float" class="hidden"></div>
  </section>

  <!-- ============ HERO / INVENTORY ============ -->
  <section class="screen" id="scr-hero">
    <div class="panel-scroll" id="hero-content"></div>
  </section>

  <!-- ============ FORGE ============ -->
  <section class="screen" id="scr-forge">
    <div class="panel-scroll" id="forge-content"></div>
  </section>

  <!-- ============ TALENTS ============ -->
  <section class="screen" id="scr-talents">
    <div class="panel-scroll" id="talents-content"></div>
  </section>

  <!-- ============ MENU ============ -->
  <section class="screen" id="scr-menu">
    <div class="panel-scroll" id="menu-content"></div>
  </section>

  <!-- ============ SUB SCREENS ============ -->
  <section class="screen" id="scr-sub">
    <div class="sub-head">
      <button class="back-btn" id="sub-back">‹ Назад</button>
      <div class="sub-title" id="sub-title">Раздел</div>
      <div class="sub-right" id="sub-right"></div>
    </div>
    <div class="panel-scroll" id="sub-content"></div>
  </section>

  <!-- ============ NAVBAR ============ -->
  <nav id="navbar">
    <button class="navbtn active" data-screen="scr-battle"><span>⚔️</span><i>Бой</i></button>
    <button class="navbtn" data-screen="scr-hero"><span>🎒</span><i>Герой</i></button>
    <button class="navbtn" data-screen="scr-forge"><span>🔨</span><i>Кузница</i></button>
    <button class="navbtn" data-screen="scr-talents"><span>🌟</span><i>Таланты</i></button>
    <button class="navbtn" data-screen="scr-menu"><span>☰</span><i>Меню</i></button>
  </nav>

  <div id="modal-root"></div>
  <div id="toasts"></div>
  <div id="tooltip" class="hidden"></div>

  <div id="boot">
    <div class="boot-logo"><img src="assets/logo.png" alt=""></div>
    <div class="boot-title">КЛИНОК И МОНЕТЫ</div>
    <div class="boot-sub">Кузница Хаоса</div>
    <div class="boot-bar"><div id="boot-fill"></div></div>
    <button id="boot-start">ИГРАТЬ</button>
    <div class="boot-tip" id="boot-tip">Совет: тапай по экрану — так ты бьёшь быстрее.</div>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/stats.js"></script>
<script src="js/loot.js"></script>
<script src="js/combat.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/minigames.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui2.js"></script>
<script src="js/main.js"></script>
</body>
</html>
